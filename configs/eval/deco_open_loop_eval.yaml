defaults:
  # 直接复用 DECO 数转的 topic、时间对齐与 18D/28D schema 配置；
  # Open Loop Eval 不维护第二套 Rosbag 清洗规则。
  - /data@conversion: KuavoRosbag2Lerobot_deco
  - _self_

hydra:
  run:
    dir: ./outputs/open_loop_eval_hydra/${now:%Y%m%d_%H%M%S}

# =====================================================
# 单个原始 Rosbag 输入
# =====================================================
input:
  rosbag_path: "/path/to/your/episode.bag"
  # 对齐到 conversion.dataset.train_hz 后，从该零基帧开始评估。
  start_frame: 0
  # null 表示一直评估到对齐 Rosbag 的有效末尾。
  max_steps: null

# =====================================================
# Rosbag 清洗与对齐参数
# =====================================================
# 下列字段覆盖 defaults 引入的 KuavoRosbag2Lerobot_deco 配置，因此一次评估只需
# 编辑本文件。固定三视角 key、18D/28D 排列及 profile 会继续由共享数转代码约束。
conversion:
  dataset:
    # 必须与 Rosbag 的真实末端执行器一致：qiangnao / leju_claw / rq2f85。
    eef_type: qiangnao
    # 必须等于 checkpoint.config.json 中保存的 dataset_hz。
    train_hz: 30
    sample_drop: 10
    is_binary: false
    resize:
      width: 640
      height: 480

  deco:
    rgb_topics:
      head_cam_h: /cam_h/color/image_raw/compressed
      wrist_cam_l: /cam_l/color/image_raw/compressed
      wrist_cam_r: /cam_r/color/image_raw/compressed

    # 脚本选择 Rosbag 中实际存在且连续的最高优先级机械臂动作 topic。
    arm_action_priority:
      - /kuavo_arm_traj_synced
      - /kuavo_arm_traj
      - /joint_cmd
    hand_state_topic: /dexhand/state
    hand_action_topic: /control_robot_hand_position
    leju_claw_state_topic: /leju_claw_state
    leju_claw_action_topic: /leju_claw_command
    rq2f85_state_topic: /gripper/state
    rq2f85_action_topic: /gripper/command
    tactile_topic: /dexhand/touch_state
    tactile_force_scale: 100.0
    arm_traj_gap_threshold_s: null

# =====================================================
# 本地 DECO checkpoint 与推理参数
# =====================================================
inference:
  # 可设为 cuda 或 cpu；脚本会在加载权重前覆盖 checkpoint 中保存的训练设备。
  device: "cuda"
  seed: 42

  checkpoint:
    # 自动解析：
    # run root  = <root>/<task>/<method>/<timestamp>
    # checkpoint = <run root>/epoch<epoch>
    # processor  = <run root>/policy_{pre,post}processor.json
    root: "outputs/train"
    task: "your_task"
    method: "deco_visual_main"
    timestamp: "run_YYYYMMDD_HHMMSS"
    # best -> epochbest；100 -> epoch100。
    epoch: best

  # null 使用 checkpoint 中保存的 Flow Matching 推理步数。
  inf_step: null
  # null 优先使用 checkpoint.n_action_steps；若其也为 null，则使用完整 chunk_size。
  action_horizon: null

# =====================================================
# 结果保存
# =====================================================
output:
  root: "outputs/open_loop_eval"
  save_plot: true
  save_summary: true
  save_predictions: true

  # 每个 action 维度的 Rosbag GT 与 DECO Prediction 绘制在同一 subplot。
  # 分页可避免 18D/28D 被保存为一张过高图片。
  paginate_dimensions: true
  dimensions_per_figure: 7
  dpi: 150
