hydra:
  run:
    dir: ./outputs/open_loop_eval_hydra/${now:%Y%m%d_%H%M%S}

# =====================================================
# 1. 单个原始 Rosbag 输入
# =====================================================
input:
  rosbag_path: "/path/to/your/episode.bag"
  # 在按历史数转 YAML 对齐后的零基帧上开始评估。
  start_frame: 0
  # null 表示一直评估到该 Rosbag 的有效末尾。
  max_steps: null

# =====================================================
# 2. 历史数据转换契约
# =====================================================
data:
  # 必须显式选择与该 checkpoint 训练数据对应的 DECO 数转 YAML。
  # Eval 只读取其中 dataset.* / deco.* 的 Rosbag、时间对齐与 GT 构造语义，
  # 不使用该 YAML 中 rosbag_dir / lerobot_dir 等数据集写盘路径。
  config_path: "/path/to/historical_KuavoRosbag2Lerobot_deco.yaml"

# =====================================================
# 3. 模型 checkpoint 定位
# =====================================================
checkpoint:
  # run root   = <root>/<task>/<method>/<timestamp>
  # checkpoint = <run root>/epoch<epoch>
  # processors = <run root>/policy_{pre,post}processor.json
  root: "outputs/train"
  task: "your_task"
  method: "deco_visual_main"
  timestamp: "run_YYYYMMDD_HHMMSS"
  # best -> epochbest；100 -> epoch100；latest/root -> run root。
  epoch: best

# =====================================================
# 4. 本次 Eval 的运行期 override
# =====================================================
runtime:
  device: "cuda"
  seed: 42

  # null -> 使用 checkpoint 保存的 Flow Matching inference step。
  inf_step: null

  # null -> checkpoint.n_action_steps；若 checkpoint 也为 null，则使用完整 chunk_size。
  # 这里只控制每次 inference 后比较/消费多少步，不修改 checkpoint.chunk_size。
  action_horizon: null

# =====================================================
# 5. 结果保存
# =====================================================
output:
  root: "outputs/open_loop_eval"
  save_plot: true
  save_summary: true
  save_predictions: true
  paginate_dimensions: true
  dimensions_per_figure: 7
  dpi: 150
