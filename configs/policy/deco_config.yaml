hydra:
  run:
    dir: ./outputs/train_hydra_save/deco_singlerun/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: ./outputs/train_hydra_save/deco_multirun/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra:job.override_dirname}

task: "your_deco_task_name"
method: "deco_visual_main"
timestamp: ${now:%Y%m%d_%H%M%S}
repoid: "lerobot/${task}"
root: "/your/path/to/your/lerobotdata_deco/lerobot"

policy_name: deco  # 固定值：当前文件只用于 Kuavo-DECO policy

training:
  output_directory: "outputs/train/${task}/${method}"
  seed: 42
  max_epoch: 100
  save_freq_epoch: 10
  log_freq: 1
  device: "cuda"
  accumulation_steps: 1
  batch_size: 16
  num_workers: 4
  drop_last: False
  max_training_step: null

  resume: false
  resume_timestamp: "run_YYYYMMDD_HHMMSS"

  # 历史 `.pth` 权重 warm start，设置 policy.load_external_init_weights=true；全新主干训练保持 null。
  deco_init_pth_path: null

  RGB_Augmenter:
    enable: True
    max_num_transforms: 1
    random_order: True
    tfs:
      notransform:
        weight: 10.0
        type: "Identity"
        kwargs: {}
      brightness:
        weight: 1.0
        type: "ColorJitter"
        kwargs: { "brightness": [0.5, 1.5] }
      contrast:
        weight: 1.0
        type: "ColorJitter"
        kwargs: { "contrast": [0.5, 1.5] }
      saturation:
        weight: 1.0
        type: "ColorJitter"
        kwargs: { "saturation": [0.5, 1.5] }
      hue:
        weight: 1.0
        type: "ColorJitter"
        kwargs: { "hue": [-0.05, 0.05] }
      sharpness:
        weight: 1.0
        type: "SharpnessJitter"
        kwargs: { "sharpness": [0.5, 1.5] }
      random_mask:
        weight: 1.0
        type: RandomMask
        kwargs:
          mask_size: [0.1, 0.1]
      random_border_cutout:
        weight: 1.0
        type: RandomBorderCutout
        kwargs:
          cut_ratio: 0.15
      gaussian_noise:
        weight: 1.0
        type: GaussianNoise
        kwargs:
          mean: 0.0
          std: 0.05
      gamma_correction:
        weight: 1.0
        type: GammaCorrection
        kwargs:
          gamma: [0.5, 2.0]
      gaussian_blur:
        weight: 1.0
        type: GaussianBlur
        kwargs:
          kernel_size: 5
          sigma: [0.1, 2.0]



policy:
  _target_: kuavo_train.wrapper.policy.deco.DECOConfigWrapper.CustomDECOConfigWrapper

  # 可选值：
  # - visual_main: 只训练 3View RGB + state 的 Visual Main 与 Action Decoder，不构建触觉训练分支。
  # - tactile_adapter: 冻结已训练的 Visual Main 与 Action Decoder，只训练 tactile/LoRA adapter。
  training_stage: visual_main

  # DECO action-token Flow Matching 主干。
  # end_effector_profile 可选值，必须与数据集 schema 一致：
  # - qiangnao_tactile: 固定 28D 灵巧手 state/action，可进入 tactile_adapter。
  # - gripper_no_tactile: 固定 18D 二夹爪 state/action，只允许 visual_main。
  end_effector_profile: qiangnao_tactile
  chunk_size: 32
  num_attn_blocks: 6
  inf_step: 5
  heads: 8
  dim: 512
  rope_axes_dim: [256, 256]
  vision_backbone: resnet34 # resnet34 / resnet18


  resize_shape: [256, 256]
  use_letterbox: true
  letterbox_fill_rgb: 0.5019607843 # raw RGB 灰色 padding 128/255

  # dataset_hz 从 LeRobot 数据集 metadata.fps 自动写入 checkpoint。
  # 归一化策略显式保留在 YAML，便于核对 checkpoint 的输入/输出数值语义：
  # - RGB/state/action 使用数据集统计量执行 MEAN_STD。
  # - tactile 必须保持 IDENTITY；其数值会在 DECO wrapper 中按左右手最大值单独归一化，
  #   不应再经过数据集均值方差处理，避免重复归一化。
  normalization_mapping:
    VISUAL:
      _target_: lerobot.configs.types.NormalizationMode
      value: MEAN_STD
    STATE:
      _target_: lerobot.configs.types.NormalizationMode
      value: MEAN_STD
    ACTION:
      _target_: lerobot.configs.types.NormalizationMode
      value: MEAN_STD
    TACTILE:
      _target_: lerobot.configs.types.NormalizationMode
      value: IDENTITY

  tactile_lora_rank: 32

  # 信息字段：单位为 Kuavo normal_force / 100 后的牛顿；当前显式固定为 25。
  tactile_left_max: 25
  tactile_right_max: 25
  clip_tactile_to_unit: true


  load_external_init_weights: false

  # tactile_adapter 的两个互斥入口：
  # - base_policy_path: 从已训练的 Visual Main + Action Decoder 新建 tactile adapter 训练；
  # - adapter_model_path: 从已有 tactile adapter checkpoint 的完整权重开始一个“新的”训练 run；
  #   如果目标是精确继续同一次训练，请不要填 adapter_model_path，改用 training.resume=true。
  base_policy_path: null
  adapter_model_path: null

  use_amp: false
  optimizer_lr: 0.0001
  optimizer_betas: [0.9, 0.999]
  optimizer_eps: 1.0e-08
  optimizer_weight_decay: 0.0001
  scheduler_name: cosine
  scheduler_warmup_steps: 500
