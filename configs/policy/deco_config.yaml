hydra:
  run:
    dir: ./outputs/train_hydra_save/deco_singlerun/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: ./outputs/train_hydra_save/deco_multirun/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra:job.override_dirname}

task: "your_deco_task_name"
method: "deco_visual_main"
timestamp: ${now:%Y%m%d_%H%M%S}
repoid: "lerobot/${task}"
root: "/your/path/to/your/lerobotdata_deco/lerobot"

policy_name: deco  # 固定值：当前文件只用于 Kuavo-DECO policy；ACT/DP 请使用各自配置文件。

training:
  output_directory: "outputs/train/${task}/${method}"
  seed: 42
  max_epoch: 100
  save_freq_epoch: 10
  log_freq: 1
  device: "cuda"
  accumulation_steps: 1
  # 固定信息：原 ACT/DP 模板曾保留 EMA 说明字段；当前 DECO 训练入口不构建 EMA，因此不提供 ema_power 配置项。
  batch_size: 16
  num_workers: 8
  drop_last: False
  max_training_step: null

  resume: false
  resume_timestamp: "run_YYYYMMDD_HHMMSS"

  # 学习率调度由 policy.scheduler_name / policy.scheduler_warmup_steps 统一控制；
  # 训练层不再重复放 scheduler_*，避免同一含义出现两份配置。

  # RGB 随机增强只作用于 RGB；DECOProcessor 会先对 RGB/depth 做同步 letterbox。
  # tfs.<name>.type 可填写 kuavo_train/utils/transforms.py 中注册的图像增强类型；
  # 当前默认集合含义：
  # - Identity: 保留原图。
  # - ColorJitter: 调整亮度/对比度/饱和度/色相。
  # - SharpnessJitter: 调整锐度。
  # - RandomMask: 随机遮挡局部区域。
  # - RandomBorderCutout: 随机裁掉边缘区域。
  # - GaussianNoise: 加高斯噪声。
  # - GammaCorrection: 做 gamma 亮度校正。
  # - GaussianBlur: 高斯模糊，用于吸收 DECO 原生 blur 增强思路。
  RGB_Augmenter:
    enable: True
    max_num_transforms: 1
    random_order: True
    tfs:
      notransform:
        weight: 3.0
        type: "Identity"
        kwargs: {}
      brightness:
        weight: 1.0
        type: "ColorJitter"
        kwargs: { "brightness": [0.5, 1.5] }
      contrast:
        weight: 1.0
        type: "ColorJitter"
        kwargs: { "contrast": [0.5, 1.5] }
      saturation:
        weight: 1.0
        type: "ColorJitter"
        kwargs: { "saturation": [0.5, 1.5] }
      hue:
        weight: 1.0
        type: "ColorJitter"
        kwargs: { "hue": [-0.05, 0.05] }
      sharpness:
        weight: 1.0
        type: "SharpnessJitter"
        kwargs: { "sharpness": [0.5, 1.5] }
      random_mask:
        weight: 1.0
        type: RandomMask
        kwargs:
          mask_size: [0.1, 0.1]
      random_border_cutout:
        weight: 1.0
        type: RandomBorderCutout
        kwargs:
          cut_ratio: 0.15
      gaussian_noise:
        weight: 1.0
        type: GaussianNoise
        kwargs:
          mean: 0.0
          std: 0.05
      gamma_correction:
        weight: 1.0
        type: GammaCorrection
        kwargs:
          gamma: [0.5, 2.0]
      gaussian_blur:
        weight: 1.0
        type: GaussianBlur
        kwargs:
          kernel_size: 5
          sigma: [0.1, 2.0]



policy:
  _target_: kuavo_train.wrapper.policy.deco.DECOConfigWrapper.CustomDECOConfigWrapper

  # 可选值：
  # - visual_main: 第一阶段 RGB-D + state 主干训练；默认关闭 tactile。
  # - tactile_adapter: 第二阶段触觉 adapter 微调；仅 qiangnao_tactile 可用，必须加载第一阶段权重。
  training_stage: visual_main
  # use_tactile=true 表示模型 forward 读取 observation.tactile；只允许 qiangnao_tactile。
  use_tactile: false
  # use_tactile_lora=true 表示启用 DECO 自实现 PI_Adapter/plugin；通常只在 tactile_adapter 阶段开启。
  use_tactile_lora: false

  # DECO action-token Flow Matching 主干。
  # end_effector_profile 可选值，必须与数据集 schema 一致：
  # - qiangnao_tactile: 28D 灵巧手 state/action，可在第二阶段启用 tactile_adapter。
  # - gripper_no_tactile: 18D 二夹爪 state/action，没有 observation.tactile，必须保持 use_tactile/use_tactile_lora=false。
  end_effector_profile: qiangnao_tactile
  chunk_size: 32
  # DECO loss 当前不消费 action_is_pad；必须丢弃至少 chunk_size-1 个尾帧，避免 padded action 入训。
  drop_n_last_frames: 31
  action_dim: 28
  obs_state: true
  use_task_condition: false
  num_tasks: 10
  num_attn_blocks: 6
  inf_step: 5
  heads: 8
  dim: 512
  rope_axes_dim: [256, 256]
  # 可选值：
  # - resnet34: 默认容量，更贴近当前 Kuavo-DECO 方案。
  # - resnet18: 低显存/低延迟备选，通常用于 ablation 或资源受限场景。
  vision_backbone: resnet34
  depth_backbone: resnet34

  # DECO 专用 RGB-D preprocessor：raw RGB-D -> letterbox -> RGB augmentation -> normalizer。
  rgb_key: observation.images.head_cam_h
  depth_key: observation.depth_h
  tactile_key: observation.tactile
  resize_shape: [256, 256]
  use_letterbox: true
  letterbox_fill_rgb: 0.5019607843 # raw RGB 灰色 padding 128/255
  letterbox_fill_depth: 0.0

  # 30Hz 数据语义动作，部署侧以 10Hz 消费队列。
  dataset_hz: 30
  control_hz: 10
  action_stride: 3

  # NormalizationMode 可选值：
  # - MEAN_STD: 使用 dataset stats 做均值方差归一化，适合 RGB/state/action。
  # - MIN_MAX: 使用 dataset stats 做 min/max 归一化，当前用于 depth。
  # - IDENTITY: 不做 LeRobot 统计归一化，当前用于 tactile，避免触觉被当作普通 STATE。
  normalization_mapping:
    VISUAL:
      _target_: lerobot.configs.types.NormalizationMode
      value: MEAN_STD
    DEPTH:
      _target_: lerobot.configs.types.NormalizationMode
      value: MIN_MAX
    STATE:
      _target_: lerobot.configs.types.NormalizationMode
      value: MEAN_STD
    ACTION:
      _target_: lerobot.configs.types.NormalizationMode
      value: MEAN_STD
    TACTILE:
      _target_: lerobot.configs.types.NormalizationMode
      value: IDENTITY

  # 第二阶段 tactile_adapter override：
  # training_stage: tactile_adapter
  # use_tactile: true
  # use_tactile_lora: true
  # base_policy_path: /path/to/stage1_policy_dir
  # tactile_left_max: 1.0
  # tactile_right_max: 1.0
  tactile_lora_rank: 32
  # true 表示加载第一阶段/外部权重后冻结已匹配主干，只训练 tactile/PI_Adapter 等新分支。
  freeze_pretrained_main: true
  # tactile_left/right_max 单位是 Kuavo normal_force / 100 后的牛顿；use_tactile=true 时必须填写正数，可以来自训练集最大值、分位数上限、人工审定安全上限和灵巧手自身量程
  tactile_left_max: 25
  tactile_right_max: 25
  clip_tactile_to_unit: true

  # 二夹爪 gripper_no_tactile override 示例：
  # end_effector_profile: gripper_no_tactile
  # action_dim: 18
  # training_stage: visual_main
  # use_tactile: false
  # use_tactile_lora: false
  # load_external_init_weights: false

  # 外部初始化路径只在训练构造时读取；保存最终 policy 时会清空，保证 `.safetensors` 自包含。
  load_external_init_weights: false

  # 三类权重入口含义：
  # - base_policy_path: 第一阶段 visual_main 保存出的 LeRobot `.safetensors` policy 目录。
  # - adapter_model_path: 已合并保存的 base + adapter 权重目录，用于部署或继续 adapter finetune。
  # - deco_init_pth_path: 仅兼容可信本地历史 `.pth`，不是正式 Kuavo-DECO 保存格式。
  # 若没有明确兼容需求，优先使用 `.safetensors`，避免 torch pickle checkpoint 的执行风险。
  base_policy_path: null
  adapter_model_path: null
  deco_init_pth_path: null

  use_amp: false
  optimizer_lr: 0.0001
  optimizer_betas: [0.9, 0.999]
  optimizer_eps: 1.0e-08
  optimizer_weight_decay: 0.0001
  # 可填写 diffusers 支持的 scheduler 名称；默认 cosine。
  scheduler_name: cosine
  scheduler_warmup_steps: 500
